<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Vacancy Research Assistant — OAuth Callback</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f7f9;
      color: #111827;
    }
    main {
      width: min(680px, calc(100% - 32px));
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,.06);
    }
    h1 { margin-top: 0; font-size: 28px; }
    p { line-height: 1.6; color: #4b5563; }
    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #111827;
    }
    code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      main { background: #1f2937; border-color: #374151; }
      p { color: #d1d5db; }
      .status, code { background: #374151; color: #f9fafb; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Vacancy Research Assistant</h1>
    <p>OAuth callback endpoint for a personal job-search application.</p>
    <div id="status" class="status">Callback endpoint is ready.</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById("status");

    if (params.get("code")) {
      status.textContent =
        "Authorization completed successfully. You can return to the application.";
    } else if (params.get("error")) {
      status.textContent =
        "Authorization was not completed. You can return to the application.";
    }
  </script>
</body>
</html>
